name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: musicdiscovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d musicdiscovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/musicdiscovery_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/musicdiscovery_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install postgresql-client (for the migration script's psql)
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Install Python packages
        run: |
          pip install -e packages/provider-types -e packages/contracts
          pip install -e apps/api[dev]

      - name: Apply migrations
        run: ./database/apply_migrations.sh

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run build
