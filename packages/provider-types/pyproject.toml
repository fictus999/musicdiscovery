[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-types"
version = "0.1.0"
description = "CatalogProvider / MusicProvider / ArtworkProvider interfaces and capability model"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]
